baseURL: https://chaoray.github.io/
locale: zh-TW
title: Ray's Blog
theme: "PaperMod"
copyright: "© 2026 Chao Ray. All rights reserved. 本站文章版權所有，未經授權禁止轉載"

ignoreFiles:
  - '\/Templates\/.*'

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  disableScrollToTop: true
  ShowCodeCopyButtons: true
  math: true

  homeInfoParams:
    Title: Hi, I am Chao Ray.
    Content: 隨便寫寫，把發現、作品、學習內容分享出來。正在攻讀資訊系，還在學習怎麼翹課。

  socialIcons:
    - name: "github"
      url: "https://github.com/Chaoray"
    - name: "discord"
      url: "https://discord.com/users/731018913097449533"
    - name: "medium"
      url: "https://medium.com/@Hyno"

languages:
  zh-tw:
    languageName: "繁體中文"
    languageCode: "zh-tw"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - identifier: about
          url: about/
          weight: 1
          pre: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg> '

        - identifier: archives
          url: archives/
          weight: 2
          pre: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"></polyline><rect x="1" y="3" width="22" height="5"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg> '

        - identifier: search
          url: search/
          weight: 3
          pre: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg> '

        - identifier: tags
          url: tags/
          weight: 4
          pre: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg> '

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - "$$"
              - "$$"
            - - '\['
              - '\]'
          inline:
            - - "$"
              - "$"
            - - '\('
              - '\)'
    renderer:
      hardWraps: true
      unsafe: true

caches:
  images:
    dir: :cacheDir/images